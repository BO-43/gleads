<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Google Leads</title>
    <meta name="description" content="Mobile-friendly survey app for Account Managers — track visits, manage leads, and export reports.">
    
    <!-- PWA META TAGS (makes it feel like a native app) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Google Leads">
    <meta name="theme-color" content="#1F4E78">
    
    <!-- Favicon: PNG files (all sizes — same pattern as RFS) -->
    <link rel="icon" type="image/png" href="favicon-32.png" sizes="32x32">
    <link rel="icon" type="image/png" href="favicon-64.png" sizes="64x64">
    <link rel="icon" type="image/png" href="favicon-192.png" sizes="192x192">
    <link rel="apple-touch-icon" href="favicon-180.png">
    <link rel="apple-touch-icon" sizes="180x180" href="favicon-180.png">
    <link rel="shortcut icon" href="favicon.ico">
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    
    <!-- Open Graph -->
    <meta property="og:title" content="Google Leads">
    <meta property="og:description" content="Mobile-friendly survey app for Account Managers — track visits, manage leads, and export reports.">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Google Leads">
    <meta property="og:image" content="favicon-512.png">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            background: #1F4E78;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            position: absolute;
            top: 0;
            left: 0;
        }
        #loader {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #1F4E78;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 18px;
            z-index: 9999;
            transition: opacity 0.4s ease;
        }
        #loader.hidden { opacity: 0; pointer-events: none; }
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(255,255,255,0.2);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        #loader-text {
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        #loader-subtext { color: rgba(255,255,255,0.5); font-size: 11px; margin-top: 4px; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="loader">
        <div class="spinner"></div>
        <div id="loader-text">Loading Google Leads...</div>
        <div id="loader-subtext">Survey &amp; Lead Management</div>
    </div>
    <iframe 
        src="https://script.google.com/macros/s/AKfycbyE86X1z5OSbNMbx_4n144qE0ut8NcSgBdAVTNO0Elg7tagXshIsw0Ic7Gu1Fy0tIWl/exec" 
        id="appFrame"
        allow="geolocation; camera; microphone; fullscreen; clipboard-read; clipboard-write"
        allowfullscreen
        allowusermedia
        onload="hideLoader()">
    </iframe>
    <script>
        function hideLoader() {
            var loader = document.getElementById('loader');
            if (loader) {
                loader.classList.add('hidden');
                setTimeout(function() { loader.style.display = 'none'; }, 400);
            }
        }
        setTimeout(hideLoader, 10000);
    </script>
</body>
</html>
